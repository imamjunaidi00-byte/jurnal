<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple</title>
</head>
<body>
    <h1>Test Page</h1>
    <div id="result"></div>
    
    <script>
        console.log('Test page loaded');
        
        const token = localStorage.getItem('guru_token');
        console.log('Token:', token ? 'exists' : 'not found');
        
        async function testAPI() {
            try {
                const res = await fetch('/api/jadwal?semester=Genap&tahunAjaran=2025/2026', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                console.log('Jadwal API response:', data);
                document.getElementById('result').innerHTML = `
                    <h2>Jadwal API Test</h2>
                    <p>Success: ${data.success}</p>
                    <p>Count: ${data.data?.length || 0}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch(e) {
                console.error('Error:', e);
                document.getElementById('result').innerHTML = `<p style="color:red">Error: ${e.message}</p>`;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
