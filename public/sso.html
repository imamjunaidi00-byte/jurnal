<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk via SSO — E-Journal Guru</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .card {
      background: white; border-radius: 20px; padding: 48px 40px;
      text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.15);
      max-width: 380px; width: 90%;
    }
    h1 { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
    p  { font-size: 14px; color: #64748b; margin-bottom: 24px; line-height: 1.5; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e2e8f0;
      border-top-color: #3b82f6; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block; margin-top: 20px; padding: 12px 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card" id="loadingCard">
    <div style="font-size:48px;margin-bottom:16px">📚</div>
    <h1>Masuk via SDMS</h1>
    <p>Memverifikasi sesi Anda dari SDMS.<br>Mohon tunggu sebentar…</p>
    <div class="spinner"></div>
    <p id="statusText" style="font-size:13px;color:#94a3b8;margin:0">Memeriksa token…</p>
  </div>

  <div class="card" id="errorCard" style="display:none">
    <div style="font-size:48px;margin-bottom:16px">⚠️</div>
    <h1>Login SSO Gagal</h1>
    <p id="errorMsg">Terjadi kesalahan saat memproses login dari SDMS.</p>
    <a href="/login" class="btn">Login Manual</a>
  </div>

  <script>
    (function () {
      const statusText = document.getElementById('statusText');

      function showError(msg) {
        document.getElementById('loadingCard').style.display = 'none';
        document.getElementById('errorCard').style.display = 'block';
        document.getElementById('errorMsg').textContent = msg;
      }

      // Cek error dari query string
      const qError = new URLSearchParams(window.location.search).get('error');
      if (qError) {
        const messages = {
          sso_no_token:        'Token SSO tidak ditemukan. Coba buka lagi dari SDMS.',
          sso_expired:         'Token SSO sudah kadaluarsa. Silakan buka ulang dari SDMS.',
          sso_invalid:         'Token SSO tidak valid.',
          sso_siswa_not_found: 'Akun siswa tidak ditemukan. Hubungi administrator.',
          sso_error:           'Terjadi kesalahan SSO. Hubungi administrator.',
        };
        showError(messages[qError] || 'Terjadi kesalahan tidak dikenal.');
        return;
      }

      // Ambil dari URL fragment
      const params = new URLSearchParams(window.location.hash.substring(1));
      const token  = params.get('token');
      const role   = params.get('role');
      const data   = params.get('data');

      if (!token) {
        showError('Token tidak ditemukan. Silakan buka kembali dari SDMS App Hub.');
        return;
      }

      statusText.textContent = 'Menyimpan sesi…';

      // Decode data user jika ada
      let userData = null;
      if (data) { try { userData = JSON.parse(atob(data)); } catch {} }

      // Simpan ke localStorage sesuai key yang dipakai masing-masing halaman
      if (role === 'siswa') {
        // Portal siswa jurnal pakai key: siswa_token + siswa_data
        localStorage.removeItem('guru_token');
        localStorage.removeItem('admin_token');
        localStorage.setItem('siswa_token', token);
        if (userData) localStorage.setItem('siswa_data', JSON.stringify(userData));
      } else if (role === 'admin') {
        // Panel admin jurnal pakai key: admin_token + admin_info
        localStorage.removeItem('guru_token');
        localStorage.removeItem('siswa_token');
        localStorage.setItem('admin_token', token);
        if (userData) localStorage.setItem('admin_info', JSON.stringify(userData));
      } else {
        // Halaman guru jurnal pakai key: guru_token + guru_info
        localStorage.removeItem('admin_token');
        localStorage.removeItem('siswa_token');
        localStorage.setItem('guru_token', token);
        if (userData) localStorage.setItem('guru_info', JSON.stringify(userData));
      }

      // Bersihkan hash & redirect langsung
      history.replaceState(null, '', '/sso.html');

      if (role === 'siswa') {
        window.location.replace('/siswa');
      } else if (role === 'admin') {
        window.location.replace('/admin');
      } else {
        window.location.replace('/app');
      }
    })();
  </script>
</body>
</html>
